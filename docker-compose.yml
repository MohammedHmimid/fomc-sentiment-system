services:
  fusion:
    build: { context: ., dockerfile: fusion-service/Dockerfile }
    ports: ["8004:8004"]
  nlp:
    build: { context: ., dockerfile: nlp-service/Dockerfile }
    ports: ["8001:8001"]
    volumes: ["./data/processed:/app/data/processed"]
  audio:
    build: { context: ., dockerfile: audio-service/Dockerfile }
    ports: ["8002:8002"]
    volumes: ["./data/processed:/app/data/processed"]
  vision:
    build: { context: ., dockerfile: vision-service/Dockerfile }
    ports: ["8003:8003"]
    volumes: ["./data/processed:/app/data/processed"]
  gateway:
    build: { context: ., dockerfile: gateway-service/Dockerfile }
    ports: ["8000:8000"]
    environment:
      NLP_URL: http://nlp:8001
      AUDIO_URL: http://audio:8002
      VISION_URL: http://vision:8003
      FUSION_URL: http://fusion:8004
    depends_on: [nlp, audio, vision, fusion]
