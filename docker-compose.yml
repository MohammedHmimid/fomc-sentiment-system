# All five services build from the single root Dockerfile; SERVICE/PORT select which.
services:
  fusion:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: fusion-service, PORT: 8004 } }
    ports: ["8004:8004"]
  nlp:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: nlp-service, PORT: 8001 } }
    ports: ["8001:8001"]
    volumes: ["./data/processed:/app/data/processed"]
  audio:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: audio-service, PORT: 8002 } }
    ports: ["8002:8002"]
    volumes: ["./data/processed:/app/data/processed"]
  vision:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: vision-service, PORT: 8003 } }
    ports: ["8003:8003"]
    volumes: ["./data/processed:/app/data/processed"]
  gateway:
    build: { context: ., dockerfile: Dockerfile, args: { SERVICE: gateway-service, PORT: 8000 } }
    ports: ["8000:8000"]
    environment:
      NLP_URL: http://nlp:8001
      AUDIO_URL: http://audio:8002
      VISION_URL: http://vision:8003
      FUSION_URL: http://fusion:8004
    # read-only access to the event list and aggregated results for the test UI
    volumes:
      - ./data/events.json:/app/data/events.json:ro
      - ./results:/app/results:ro
    depends_on: [nlp, audio, vision, fusion]
